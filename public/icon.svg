<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="disc" cx="34%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F4B784"/>
      <stop offset="55%" stop-color="#D58A4F"/>
      <stop offset="100%" stop-color="#A85F2C"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2B677"/>
      <stop offset="100%" stop-color="#9E5429"/>
    </linearGradient>
    <clipPath id="you"><circle cx="24.5" cy="32" r="16.5"/></clipPath>
  </defs>

  <!-- you: a solid copper coin -->
  <circle cx="24.5" cy="32" r="16.5" fill="url(#disc)"/>
  <!-- what you hold together: the bright shared middle -->
  <g clip-path="url(#you)"><circle cx="39.5" cy="32" r="16.5" fill="#F9D6AB"/></g>
  <!-- your AI: an open ring, overlapping -->
  <circle cx="39.5" cy="32" r="16.5" fill="none" stroke="url(#ring)" stroke-width="3.3"/>
</svg>
