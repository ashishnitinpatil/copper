<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fb" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Classic is the
      // default for new installs; Warm Ledger is the bare :root (no attribute),
      // every other theme sets data-theme on <html>.
      (function () {
        try {
          var t = localStorage.getItem('et-theme') || 'classic';
          if (t !== 'warm') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Copper is a local-first personal finance tracker you and your AI keep together, synced privately through your own Google Drive." />
    <meta property="og:title" content="Copper" />
    <meta property="og:description" content="Personal finance, kept together — you and your AI. Local-first and private, synced through your own Google Drive." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Copper" />
    <meta name="twitter:description" content="Personal finance, kept together — you and your AI." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Copper" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Copper</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
