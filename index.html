<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f2" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Copper (warm
      // paper, on-brand) is the default for new installs; Warm Ledger is the bare
      // :root (no attribute), every other theme sets data-theme on <html>.
      (function () {
        try {
          var t = localStorage.getItem('et-theme') || 'copper';
          var root = document.documentElement;
          if (t.indexOf('custom:') === 0) {
            // A theme made in Settings: its colours are cached alongside.
            var c = JSON.parse(localStorage.getItem('et-theme-custom'));
            root.setAttribute('data-theme', 'custom-' + c.mode);
            for (var k in c.vars) root.style.setProperty(k, c.vars[k]);
          } else if (t !== 'warm') root.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Copper is a free, private expense tracker for you or you and a partner. Your data stays in your browser and syncs through your own Google Drive — no sign-up, no servers, no ads." />
    <link rel="canonical" href="https://copper.ashishnitinpatil.com/" />
